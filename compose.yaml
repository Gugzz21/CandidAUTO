services:
  postgres:
    image: postgres:16-alpine
    container_name: job-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-job_assistant}
      POSTGRES_USER: ${DB_USER:-job_assistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - job_assistant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-job_assistant} -d ${DB_NAME:-job_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  job_assistant_pgdata:
