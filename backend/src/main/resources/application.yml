server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: job-assistant-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:job_assistant}
    username: ${DB_USER:job_assistant}
    password: ${DB_PASSWORD:job_assistant_dev_pwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:10}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:10}MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    resumes-dir: ${STORAGE_RESUMES_DIR:./infra/storage/resumes}
    max-upload-size-bytes: 10485760
  llm:
    provider: ${LLM_PROVIDER:openai-compatible}
    api-url: ${LLM_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
    api-key: ${CandidAUTO_API_KEY:${CANDIDAUTO_API_KEY:${NVIDIA_API_KEY:${LLM_API_KEY:}}}}
    model: ${LLM_MODEL:meta/llama-3.1-70b-instruct}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:45}

management:
  endpoints:
    web:
      exposure:
        include: health,info
