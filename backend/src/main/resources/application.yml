server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: job-assistant-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:job_assistant}
    username: ${DB_USER:job_assistant}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:10}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:10}MB

app:
  security:
    local-personal-mode: ${APP_SECURITY_LOCAL_PERSONAL_MODE:true}
    allow-test-user-header: false
    jwt-secret: ${APP_JWT_SECRET:}
    jwt-expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    resumes-dir: ${STORAGE_RESUMES_DIR:./infra/storage/resumes}
    max-upload-size-bytes: 10485760
  llm:
    provider: ${LLM_PROVIDER:openai-compatible}
    api-url: ${LLM_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
    api-key: ${CandidAUTO_API_KEY:${CANDIDAUTO_API_KEY:${NVIDIA_API_KEY:${LLM_API_KEY:}}}}
    model: ${LLM_MODEL:meta/llama-3.1-70b-instruct}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:45}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    poll-ms: ${SCHEDULING_POLL_MS:60000}
    initial-delay-ms: ${SCHEDULING_INITIAL_DELAY_MS:15000}
  discovery:
    open-web-enabled: ${OPEN_WEB_DISCOVERY_ENABLED:true}
    curated-greenhouse-boards: ${CURATED_GREENHOUSE_BOARDS:nubank:Nubank,brex:Brex,gitlab:GitLab,cloudflare:Cloudflare}
    curated-lever-boards: ${CURATED_LEVER_BOARDS:}
  connectors:
    greenhouse:
      base-url: ${GREENHOUSE_API_URL:https://boards-api.greenhouse.io/v1/boards}
    lever:
      base-url: ${LEVER_API_URL:https://api.lever.co/v0/postings}
    gupy:
      portal-api-url: ${GUPY_PORTAL_API_URL:https://portal.api.gupy.io/api/v1/jobs}
    remotive:
      api-url: ${REMOTIVE_API_URL:https://remotive.com/api/remote-jobs}
    arbeitnow:
      api-url: ${ARBEITNOW_API_URL:https://www.arbeitnow.com/api/job-board-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
